# Delete GitHub pre-releases older than 30 days (Asia/Hong_Kong).
# Official (non-prerelease) releases are never deleted.
name: Cleanup prereleases

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-prereleases
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TZ: Asia/Hong_Kong
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /.github/scripts/common.sh
            /.github/scripts/cleanup-prereleases.sh
          sparse-checkout-cone-mode: false

      - name: Delete expired pre-releases
        run: bash .github/scripts/cleanup-prereleases.sh
