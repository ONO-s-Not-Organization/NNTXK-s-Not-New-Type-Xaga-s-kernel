# Manual / auto kernel build for xagapro 5.10.66.
# Do not migrate to GKI. Do not publish a Release unless every gate passes.
name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      KSU_REF:
        description: "KOWX712/KernelSU tag or commit (latest = newest kernel/ commit)"
        required: false
        default: latest
      SUSFS_REF:
        description: "simonpunk/susfs4ksu gki-android12-5.10 tag or commit"
        required: false
        default: latest
      BUILD_TYPE:
        description: "manual or auto"
        required: false
        default: manual

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KSU_REF: ${{ inputs.KSU_REF || 'latest' }}
      SUSFS_REF: ${{ inputs.SUSFS_REF || 'latest' }}
      BUILD_TYPE: ${{ inputs.BUILD_TYPE || 'manual' }}
      TZ: Asia/Hong_Kong
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      KBUILD_BUILD_TIMESTAMP: "Fri Sep 1 00:00:00 CST 2023"
      KBUILD_BUILD_USER: xagapro
      KBUILD_BUILD_HOST: github-actions
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/graalvm \
            /usr/local/share/chromium || true
          df -h

      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl python3 zip unzip ccache flex bison libssl-dev \
            libelf-dev bc rsync patch ca-certificates

      - name: Compute KernelRelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/version.sh

      - name: Cache clang toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchains/clang-r416183b
            ~/toolchains/gas
            ~/toolchains/build-tools
          key: xaga-clang-r416183b-gas-build-tools

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Setup toolchain
        run: bash .github/scripts/setup-toolchain.sh

      - name: Resolve refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-refs.sh

      - name: Integrate and compile (at most two pairs)
        run: bash .github/scripts/try-build.sh

      - name: Package AnyKernel zip
        run: bash .github/scripts/package.sh

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            .ci-work/kernel.log
            .ci-work/resolved-refs.env
            **/*.rej
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="$(ls -1 .ci-work/*.zip | head -n 1)"
          test -f "${ZIP}"
          test -f .ci-work/build-info.json
          bash .github/scripts/make-release.sh "${ZIP}"
